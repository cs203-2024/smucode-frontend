name: Build image and push to ECR

on: # workflow trigger on manual, PR & push to dev
  #  push:
  #    branches: [dev, prod]
  workflow_dispatch:

permissions:
  id-token: write # for aws oidc connection
  contents: read # to check out code

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # checkout code from repository
      - name: Pull code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        run: |
          npm install
          npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ var.API_BASE_URL }}
          NEXT_PUBLIC_PROFILE_PICTURE_BUCKET: ${{ var.AWS_PROFILE_PICTURE_BUCKET }}

      - name: Deploy to S3
        run: aws s3 sync ./out s3://${{ secrets.AWS_FRONTEND_BUCKET }} --delete --acl public-read

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
